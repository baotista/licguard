[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.33.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "powershell", "homebrew"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-musl", "x86_64-apple-darwin", "x86_64-unknown-linux-musl", "x86_64-pc-windows-msvc"]
# Where to host releases
hosting = "github"
# Release from the Actions tab (workflow_dispatch with the tag as input)
# instead of on a tag push; dist creates the tag along with the Release
dispatch-releases = true
# A GitHub repo to push Homebrew formulas to
tap = "baotista/homebrew-tap"
# Publish jobs to run in CI: "homebrew" pushes the formula to the tap (needs
# the HOMEBREW_TAP_TOKEN secret); "./publish-crates" and "./publish-container"
# are the reusable workflows .github/workflows/publish-crates.yml and
# .github/workflows/publish-container.yml
publish-jobs = ["homebrew", "./publish-crates", "./publish-container"]

# Permissions of the custom publish jobs
[dist.github-custom-job-permissions]
"publish-crates" = { contents = "read" }
"publish-container" = { contents = "read", packages = "write" }

[package]
name = "licguard"
version = "0.1.0"
edition = "2024"
description = "Check the licenses of your project's dependencies against your license policy"
license = "Apache-2.0"
repository = "https://github.com/baotista/licguard"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
spdx = "0.13.5"
toml = "1.1.6"

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
tempfile = "3.27.0"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
